name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # 1.26.6 fixes 7 stdlib vulns that govulncheck reports as CALLED on
        # 1.26.5: crypto/tls, net/http (x2), net/url, html/template,
        # encoding/xml, encoding/asn1. Release binaries are the reason this
        # matters — v1.15.0 shipped built on 1.26.5 and carries them. Keep this
        # in lockstep with the CI Security Scan toolchain, or the scan passes
        # while the artifacts users download stay vulnerable.
        go-version: '1.26.6'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build binaries
      env:
        # v1.9.0 introduces a CGo tree-sitter TypeScript parser behind a
        # //go:build cgo constraint. Release binaries are built pure-Go
        # (CGO_ENABLED=0) so every platform in the release matrix gets
        # the same fully-static artifact and the parser_ts_stub.go
        # fallback. Users who want the tree-sitter improvement can
        # build from source with CGo enabled. The v2.1.0 release
        # workflow will replace this with a zig-cc cross-toolchain or
        # a native-runner matrix so the tree-sitter parser ships with
        # pre-built binaries too.
        CGO_ENABLED: "0"
        # The persona key (W5 rulings 15, 20). Only this step sees it. It
        # reaches the shell as an environment variable, never as workflow
        # text, and nothing below echoes it or the flags that carry it;
        # GitHub also masks it in logs.
        CELESTE_PERSONA_KEY: ${{ secrets.CELESTE_PERSONA_KEY }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        set -euo pipefail
        # The secret was uploaded from a key file that ends in a newline:
        # trim whitespace before checking its shape.
        PERSONA_KEY="$(printf '%s' "$CELESTE_PERSONA_KEY" | tr -d ' \t\r\n')"
        if ! [[ "$PERSONA_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "::error::the CELESTE_PERSONA_KEY secret is missing or is not 64 hex characters"
          exit 1
        fi
        # -X main.Channel=release is what makes a binary official to
        # celeste update and the go install upgrade (W5 ruling 29).
        # -trimpath: without it the toolchain copies the whole -ldflags
        # string, key included, into the binary's build info.
        LDFLAGS="-X main.Version=${VERSION} -X main.CommitSHA=${GITHUB_SHA} -X main.Channel=release -X github.com/whykusanagi/celeste-cli/cmd/celeste/prompts.personaKey=${PERSONA_KEY}"
        build() { GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" -o "dist/$3" ./cmd/celeste; }
        build linux amd64 celeste-linux-amd64
        build linux arm64 celeste-linux-arm64
        build darwin amd64 celeste-darwin-amd64
        build darwin arm64 celeste-darwin-arm64
        build windows amd64 celeste-windows-amd64.exe

    # Fail the release, not users (W5 ruling 20): the runner can execute the
    # linux-amd64 binary, and `persona verify` exits non-zero unless all
    # four profiles decrypt and match SOURCE.json. The other four come from
    # the same source and flags. No artifact may record the key in its
    # build info. Nothing is archived, signed or published if this fails.
    - name: Verify the persona
      run: |
        set -euo pipefail
        ./dist/celeste-linux-amd64 persona verify
        for f in dist/celeste-*; do
          # Captured, not piped into grep -q: under pipefail an early grep
          # exit could SIGPIPE go version and hide a match.
          info="$(go version -m "$f")"
          case "$info" in
            *personaKey*)
              echo "::error::$f records the persona key in its build info"
              exit 1
              ;;
          esac
        done

    # THE UPDATER CONTRACT (W5 ruling 30). `go install` builds and
    # `celeste update` download these exact names from every release:
    # celeste-{linux,darwin}-{amd64,arm64}.tar.gz holding
    # celeste-<os>-<arch> at the archive root, celeste-windows-amd64.zip
    # holding celeste-windows-amd64.exe, checksums.txt (sha256sum format),
    # manifest.json (with "tag"), and the armoured detached signatures
    # checksums.txt.asc and manifest.json.asc. Renaming any of them breaks
    # every installed binary's updater. cmd/celeste/selfupdate's
    # TestReleaseWorkflowKeepsTheUpdaterContract checks this file.
    - name: Create archives
      run: |
        cd dist
        tar czf celeste-linux-amd64.tar.gz celeste-linux-amd64
        tar czf celeste-linux-arm64.tar.gz celeste-linux-arm64
        tar czf celeste-darwin-amd64.tar.gz celeste-darwin-amd64
        tar czf celeste-darwin-arm64.tar.gz celeste-darwin-arm64
        zip celeste-windows-amd64.zip celeste-windows-amd64.exe

    - name: Generate checksums
      run: |
        cd dist
        sha256sum *.tar.gz *.zip > checksums.txt

    - name: Generate manifest
      run: |
        chmod +x scripts/generate-manifest.sh
        ./scripts/generate-manifest.sh \
          --version "${{ steps.get_version.outputs.VERSION }}" \
          --commit "${{ github.sha }}" \
          --tag "v${{ steps.get_version.outputs.VERSION }}" \
          --go-version "1.26.6" \
          --dist-dir dist \
          --output dist/manifest.json

    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --import --batch
        echo "GPG key imported successfully"

    - name: Sign manifest and checksums
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        cd dist

        # Configure GPG for non-interactive use
        export GPG_TTY=$(tty)
        echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
        gpg-connect-agent reloadagent /bye

        # Sign manifest (passing passphrase via stdin)
        echo "$GPG_PASSPHRASE" | gpg --detach-sign --armor --batch --yes --passphrase-fd 0 --pinentry-mode loopback --local-user 940490EF09DA31322BF7FD83875849AB1D541C55 manifest.json

        # Sign checksums
        echo "$GPG_PASSPHRASE" | gpg --detach-sign --armor --batch --yes --passphrase-fd 0 --pinentry-mode loopback --local-user 940490EF09DA31322BF7FD83875849AB1D541C55 checksums.txt

        # Create signatures info file
        cat > SIGNATURES.txt << 'EOF'
        GPG Signatures for Celeste CLI v${{ steps.get_version.outputs.VERSION }}

        Signed by: whykusanagi <me@whykusanagi.xyz>
        Key ID: 940490EF09DA31322BF7FD83875849AB1D541C55

        Files:
        - manifest.json.asc (signature for manifest.json)
        - checksums.txt.asc (signature for checksums.txt)

        Verification:
        See VERIFICATION.md in the repository for verification instructions.
        https://github.com/whykusanagi/celeste-cli/blob/main/VERIFICATION.md
        EOF

    # Check what users' updaters will check, with the release binary itself
    # and its embedded key (W5 ruling 30), then cross-check with gpg. A
    # release that would fail any updater publishes nothing.
    - name: Verify the updater contract
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        set -euo pipefail
        ./dist/celeste-linux-amd64 update --verify-dist dist --tag "v${VERSION}"
        gpg --verify dist/checksums.txt.asc dist/checksums.txt
        gpg --verify dist/manifest.json.asc dist/manifest.json

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/manifest.json
          dist/manifest.json.asc
          dist/checksums.txt
          dist/checksums.txt.asc
          dist/SIGNATURES.txt
        body: |
          ## Celeste CLI ${{ steps.get_version.outputs.VERSION }}

          ### Installation

          Download the appropriate binary for your platform:

          **Linux (amd64)**:
          ```bash
          wget https://github.com/whykusanagi/celeste-cli/releases/download/v${{ steps.get_version.outputs.VERSION }}/celeste-linux-amd64.tar.gz
          tar xzf celeste-linux-amd64.tar.gz
          sudo mv celeste-linux-amd64 /usr/local/bin/celeste
          ```

          **macOS (Apple Silicon)**:
          ```bash
          wget https://github.com/whykusanagi/celeste-cli/releases/download/v${{ steps.get_version.outputs.VERSION }}/celeste-darwin-arm64.tar.gz
          tar xzf celeste-darwin-arm64.tar.gz
          sudo mv celeste-darwin-arm64 /usr/local/bin/celeste
          ```

          **Windows**:
          Download `celeste-windows-amd64.zip` and extract to a directory in your PATH.

          ### Verify Installation
          Check the signatures and checksums as described in [VERIFY.md](https://github.com/whykusanagi/celeste-cli/blob/main/VERIFY.md), then confirm the official persona:
          ```bash
          celeste persona verify
          ```

          ### Changes
          See [CHANGELOG.md](https://github.com/whykusanagi/celeste-cli/blob/main/CHANGELOG.md) for details.
        draft: false
        # Pre-release tags carry a hyphenated suffix (e.g. v1.10.0-rc.1, v1.10.0-dev.2);
        # publish those as GitHub pre-releases (not marked "latest"). Stable v1.10.0
        # tags publish as a normal release (action-gh-release@v1 marks non-prereleases
        # as "latest" automatically).
        prerelease: ${{ contains(github.ref_name, '-') }}
