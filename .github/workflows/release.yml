name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run (#376): Actions > Release > Run workflow, on any branch, no tag.
  # Builds every target on its own runner and smoke-tests it there, and
  # nothing leaves the runners: no artifacts, no release. The release job
  # below only runs for a pushed v* tag.
  workflow_dispatch:

# Nothing by default: each job asks for what it needs, and only the release
# job can write.
permissions: {}

# One run per tag (or dry-run branch) at a time. A second run waits; a run
# that is signing or publishing is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs before any job that holds a secret (Aikido 806869730). A pushed tag
  # publishes only if it is an annotated tag signed by the release key, and
  # the commit it names is on main. The key comes from main's tree, never
  # from the tag's, so a tag cannot bring its own key. A workflow_dispatch
  # dry run from a branch has no tag and publishes nothing: it skips the
  # check. A dispatch from a tag is checked like a push.
  verify-tag:
    name: Verify the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false  # no git writes here

    - name: Verify the tag signature and ancestry
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" != push ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
          echo "dry run on $GITHUB_REF: no tag to verify, and nothing is published"
          exit 0
        fi
        case "$GITHUB_REF" in
          refs/tags/v*) ;;
          *) echo "::error::$GITHUB_REF is not a release tag"; exit 1 ;;
        esac
        # actions/checkout can leave an annotated tag as a lightweight
        # one: fetch the tag object itself, and main to compare against.
        git fetch --force --no-tags origin "+${GITHUB_REF}:${GITHUB_REF}"
        git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
        if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
          echo "::error::$GITHUB_REF is a lightweight tag; release tags must be signed (git tag -s)"
          exit 1
        fi
        if [ "$(git rev-parse "${GITHUB_REF}^{commit}")" != "$GITHUB_SHA" ]; then
          echo "::error::$GITHUB_REF does not point at the commit this run builds"
          exit 1
        fi
        # A keyring of its own holding only the release key, read from
        # main. Releases are signed by the signing subkey; accept it or
        # the primary.
        PRIMARY=940490EF09DA31322BF7FD83875849AB1D541C55
        SUBKEY=F4C254F6EE5D7F086C921DEBA6BB54DDC70EE8FB
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        chmod 700 "$GNUPGHOME"
        git show origin/main:whykusanagi.asc > "$RUNNER_TEMP/release-key.asc"
        fprs="$(gpg --batch --with-colons --import-options show-only --import "$RUNNER_TEMP/release-key.asc" | awk -F: '$1 == "fpr" {print $10}')"
        case "$fprs" in
          *"$PRIMARY"*) ;;
          *) echo "::error::main's whykusanagi.asc is not the release key"; exit 1 ;;
        esac
        gpg --batch --import "$RUNNER_TEMP/release-key.asc"
        # --raw prints gpg's machine-readable status lines on stderr. The
        # first VALIDSIG field is the key that made the signature.
        if ! status="$(git verify-tag --raw "$GITHUB_REF" 2>&1 >/dev/null)"; then
          printf '%s\n' "$status"
          echo "::error::$GITHUB_REF has no valid signature by the release key"
          exit 1
        fi
        signer="$(printf '%s\n' "$status" | awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" {print $3; exit}')"
        if [ "$signer" != "$PRIMARY" ] && [ "$signer" != "$SUBKEY" ]; then
          printf '%s\n' "$status"
          echo "::error::$GITHUB_REF is not signed by the release key (VALIDSIG ${signer:-missing})"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$GITHUB_REF tags a commit that is not on main"
          exit 1
        fi
        echo "$GITHUB_REF: signed by $signer, on main"

  # One job per target, each on a runner of that OS and architecture, so CGo
  # compiles the tree-sitter parsers (TypeScript, PHP, Python, Rust, Java,
  # C/C++, Ruby) into the binary with the runner's own C compiler (#376).
  # Until v2.0.0 every release was CGO_ENABLED=0 and shipped only the regex
  # fallback.
  build:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    # Builds only read the repository; the release job alone writes.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux links fully statically (see the build step), so the
          # runner's glibc sets no floor; 22.04 is the oldest supported one.
          - target: linux-amd64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          # macos-13 is retired and macos-14 is deprecated: the last Intel
          # image is macos-15-intel.
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          # The image's preinstalled MinGW-w64 gcc is on PATH.
          - target: windows-amd64
            runner: windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false  # no git writes here

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # 1.26.6 fixes 7 stdlib vulns that govulncheck reports as CALLED on
        # 1.26.5: crypto/tls, net/http (x2), net/url, html/template,
        # encoding/xml, encoding/asn1. Release binaries are the reason this
        # matters — v1.15.0 shipped built on 1.26.5 and carries them. Keep this
        # in lockstep with the CI Security Scan toolchain, or the scan passes
        # while the artifacts users download stay vulnerable.
        go-version: '1.26.6'
        # A release compiles every C object from scratch: no build cache
        # shared with CI runs, whose objects carry other flags.
        cache: false

    - name: Get version from tag
      id: get_version
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ]; then
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
        else
          # A dry run has no tag. A pre-release below every real version.
          echo "VERSION=0.0.0-dryrun.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build binaries
      id: build
      env:
        # #376: CGo on, so the //go:build cgo tree-sitter parsers are
        # compiled in instead of the parser_*_stub.go regex fallbacks.
        CGO_ENABLED: "1"
        # The persona key (W5 rulings 15, 20). Only this step sees it. It
        # reaches the shell as an environment variable, never as workflow
        # text, and nothing below echoes it or the flags that carry it;
        # GitHub also masks it in logs.
        CELESTE_PERSONA_KEY: ${{ secrets.CELESTE_PERSONA_KEY }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        # The secret was uploaded from a key file that ends in a newline:
        # trim whitespace before checking its shape.
        PERSONA_KEY="$(printf '%s' "$CELESTE_PERSONA_KEY" | tr -d ' \t\r\n')"
        PERSONA=yes
        if ! [[ "$PERSONA_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
          if [ "$GITHUB_EVENT_NAME" != push ] && [ -z "$PERSONA_KEY" ]; then
            # A dry run where the secret is not available (a fork): build
            # the public persona and skip persona verify. A tag never may.
            echo "::warning::no CELESTE_PERSONA_KEY secret: this dry run builds the public persona and skips persona verify"
            PERSONA=no
          else
            echo "::error::the CELESTE_PERSONA_KEY secret is missing or is not 64 hex characters"
            exit 1
          fi
        fi
        echo "persona=$PERSONA" >> "$GITHUB_OUTPUT"
        # -X main.Channel=release is what makes a binary official to
        # celeste update and the go install upgrade (W5 ruling 29).
        # -trimpath: without it the toolchain copies the whole -ldflags
        # string, key included, into the binary's build info.
        LDFLAGS="-X main.Version=${VERSION} -X main.CommitSHA=${GITHUB_SHA} -X main.Channel=release"
        if [ "$PERSONA" = yes ]; then
          LDFLAGS="$LDFLAGS -X github.com/whykusanagi/celeste-cli/v2/cmd/celeste/prompts.personaKey=${PERSONA_KEY}"
        fi
        TAGS=""
        case "$TARGET" in
          linux-*)
            # Fully static, as the CGO_ENABLED=0 binaries were: no glibc
            # version floor. netgo and osusergo keep the pure-Go DNS
            # resolver and user lookup those binaries had, so nothing needs
            # glibc's NSS modules at run time.
            TAGS="netgo,osusergo"
            LDFLAGS="$LDFLAGS -linkmode=external -extldflags=-static"
            ;;
          darwin-*)
            # Go 1.26 supports macOS 12 and later; compile the C parsers for
            # the same floor instead of the runner's own macOS version.
            export MACOSX_DEPLOYMENT_TARGET=12.0
            export CGO_CFLAGS="-O2 -g -mmacosx-version-min=12.0"
            ;;
          windows-*)
            # Link libgcc and winpthread in: no MinGW DLLs beside the .exe.
            LDFLAGS="$LDFLAGS -linkmode=external -extldflags=-static"
            ;;
        esac
        build() { GOOS="$1" GOARCH="$2" go build -trimpath -tags "$TAGS" -ldflags "$LDFLAGS" -o "dist/$3" ./cmd/celeste; }
        # Each runner builds only its own target: CGo needs that OS's C
        # toolchain. The names below are the updater contract's.
        case "$TARGET" in
          linux-amd64)
            build linux amd64 celeste-linux-amd64
            ;;
          linux-arm64)
            build linux arm64 celeste-linux-arm64
            ;;
          darwin-amd64)
            build darwin amd64 celeste-darwin-amd64
            ;;
          darwin-arm64)
            build darwin arm64 celeste-darwin-arm64
            ;;
          windows-amd64)
            build windows amd64 celeste-windows-amd64.exe
            ;;
          *)
            echo "::error::unknown target $TARGET"
            exit 1
            ;;
        esac

    # Every binary runs on the runner that built it, release or dry run:
    # it starts, it carries working tree-sitter parsers (index selfcheck
    # indexes a small TypeScript/PHP/Python/Java repo and fails on the regex
    # fallback), its persona decrypts, and it links only what every
    # machine of that OS has.
    - name: Smoke test on this runner
      env:
        TARGET: ${{ matrix.target }}
        PERSONA: ${{ steps.build.outputs.persona }}
      run: |
        set -euo pipefail
        bin="dist/celeste-${TARGET}"
        case "$TARGET" in windows-*) bin="${bin}.exe" ;; esac
        "./$bin" --version
        "./$bin" index selfcheck
        if [ "$PERSONA" = yes ]; then
          "./$bin" persona verify
        fi
        # Captured, not piped into grep -q: under pipefail an early grep
        # exit could SIGPIPE the producer and hide a match.
        case "$TARGET" in
          linux-*)
            info="$(file "$bin")"
            echo "$info"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "::error::$bin is not statically linked"; exit 1 ;;
            esac
            ;;
          darwin-*)
            libs="$(otool -L "$bin" | tail -n +2)"
            echo "$libs"
            if printf '%s\n' "$libs" | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' >/dev/null; then
              echo "::error::$bin links a library outside the OS"
              exit 1
            fi
            minos="$(vtool -show-build "$bin" | awk '$1 == "minos" {print $2}')"
            echo "minos $minos"
            if [ "$minos" != 12.0 ]; then
              echo "::error::$bin requires macOS $minos, want 12.0"
              exit 1
            fi
            ;;
          windows-*)
            # objdump ships with the MinGW gcc; take whichever name the
            # image puts on PATH and fail loudly if neither is there.
            od="$(command -v objdump || command -v x86_64-w64-mingw32-objdump || true)"
            if [ -z "$od" ]; then
              echo "::error::no objdump on PATH to check $bin's DLL imports"
              exit 1
            fi
            dlls="$("$od" -p "$bin" | grep 'DLL Name')"
            echo "$dlls"
            case "$dlls" in
              *libgcc*|*libwinpthread*|*libstdc*)
                echo "::error::$bin needs MinGW DLLs"
                exit 1
                ;;
            esac
            ;;
        esac

    # Tag builds only: a dry-run binary carries the persona key but no
    # signature, so it stays on its runner.
    - name: Upload binary
      if: github.event_name == 'push'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: celeste-${{ matrix.target }}
        path: dist/celeste-${{ matrix.target }}*
        if-no-files-found: error
        retention-days: 7

  release:
    name: Create Release
    needs: [verify-tag, build]
    # Only a pushed v* tag publishes. A workflow_dispatch dry run stops after
    # the build job, even when started from a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes: it publishes the release.
    permissions:
      contents: write

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false  # publishing goes through the API token

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Lockstep with the build job (see the comment there).
        go-version: '1.26.6'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Download binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: celeste-*
        path: dist
        merge-multiple: true

    # Artifacts do not keep file modes: restore the executable bit the
    # archives have always carried.
    - name: Restore executable bits
      run: |
        set -euo pipefail
        chmod 0755 dist/celeste-*
        ls -l dist

    # Fail the release, not users (W5 ruling 20): the runner can execute the
    # linux-amd64 binary, and `persona verify` exits non-zero unless all
    # four profiles decrypt and match SOURCE.json (each build job already
    # ran it on its own binary). No artifact may record the key in its
    # build info. Nothing is archived, signed or published if this fails.
    - name: Verify the persona
      run: |
        set -euo pipefail
        ./dist/celeste-linux-amd64 persona verify
        for f in dist/celeste-*; do
          # Captured, not piped into grep -q: under pipefail an early grep
          # exit could SIGPIPE go version and hide a match.
          info="$(go version -m "$f")"
          case "$info" in
            *personaKey*)
              echo "::error::$f records the persona key in its build info"
              exit 1
              ;;
          esac
        done

    # THE UPDATER CONTRACT (W5 ruling 30). `go install` builds and
    # `celeste update` download these exact names from every release:
    # celeste-{linux,darwin}-{amd64,arm64}.tar.gz holding
    # celeste-<os>-<arch> at the archive root, celeste-windows-amd64.zip
    # holding celeste-windows-amd64.exe, checksums.txt (sha256sum format),
    # manifest.json (with "tag"), and the armoured detached signatures
    # checksums.txt.asc and manifest.json.asc. Renaming any of them breaks
    # every installed binary's updater. cmd/celeste/selfupdate's
    # TestReleaseWorkflowKeepsTheUpdaterContract checks this file.
    - name: Create archives
      run: |
        cd dist
        tar czf celeste-linux-amd64.tar.gz celeste-linux-amd64
        tar czf celeste-linux-arm64.tar.gz celeste-linux-arm64
        tar czf celeste-darwin-amd64.tar.gz celeste-darwin-amd64
        tar czf celeste-darwin-arm64.tar.gz celeste-darwin-arm64
        zip celeste-windows-amd64.zip celeste-windows-amd64.exe

    - name: Generate checksums
      run: |
        cd dist
        sha256sum *.tar.gz *.zip > checksums.txt

    - name: Generate manifest
      run: |
        chmod +x scripts/generate-manifest.sh
        ./scripts/generate-manifest.sh \
          --version "${{ steps.get_version.outputs.VERSION }}" \
          --commit "${{ github.sha }}" \
          --tag "v${{ steps.get_version.outputs.VERSION }}" \
          --go-version "1.26.6" \
          --dist-dir dist \
          --output dist/manifest.json

    - name: Import GPG key
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --import --batch
        echo "GPG key imported successfully"

    - name: Sign manifest and checksums
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        cd dist

        # Configure GPG for non-interactive use
        export GPG_TTY=$(tty)
        echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
        gpg-connect-agent reloadagent /bye

        # Sign manifest (passing passphrase via stdin)
        echo "$GPG_PASSPHRASE" | gpg --detach-sign --armor --batch --yes --passphrase-fd 0 --pinentry-mode loopback --local-user 940490EF09DA31322BF7FD83875849AB1D541C55 manifest.json

        # Sign checksums
        echo "$GPG_PASSPHRASE" | gpg --detach-sign --armor --batch --yes --passphrase-fd 0 --pinentry-mode loopback --local-user 940490EF09DA31322BF7FD83875849AB1D541C55 checksums.txt

        # Create signatures info file
        cat > SIGNATURES.txt << 'EOF'
        GPG Signatures for Celeste CLI v${{ steps.get_version.outputs.VERSION }}

        Signed by: whykusanagi <me@whykusanagi.xyz>
        Key ID: 940490EF09DA31322BF7FD83875849AB1D541C55

        Files:
        - manifest.json.asc (signature for manifest.json)
        - checksums.txt.asc (signature for checksums.txt)

        Verification:
        See VERIFICATION.md in the repository for verification instructions.
        https://github.com/whykusanagi/celeste-cli/blob/main/VERIFICATION.md
        EOF

    # Check what users' updaters will check, with the release binary itself
    # and its embedded key (W5 ruling 30), then cross-check with gpg. A
    # release that would fail any updater publishes nothing.
    - name: Verify the updater contract
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        set -euo pipefail
        ./dist/celeste-linux-amd64 update --verify-dist dist --tag "v${VERSION}"
        gpg --verify dist/checksums.txt.asc dist/checksums.txt
        gpg --verify dist/manifest.json.asc dist/manifest.json

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/manifest.json
          dist/manifest.json.asc
          dist/checksums.txt
          dist/checksums.txt.asc
          dist/SIGNATURES.txt
        body: |
          ## Celeste CLI ${{ steps.get_version.outputs.VERSION }}

          ### Installation

          Download the appropriate binary for your platform:

          **Linux (amd64)**:
          ```bash
          wget https://github.com/whykusanagi/celeste-cli/releases/download/v${{ steps.get_version.outputs.VERSION }}/celeste-linux-amd64.tar.gz
          tar xzf celeste-linux-amd64.tar.gz
          sudo mv celeste-linux-amd64 /usr/local/bin/celeste
          ```

          **macOS (Apple Silicon)**:
          ```bash
          wget https://github.com/whykusanagi/celeste-cli/releases/download/v${{ steps.get_version.outputs.VERSION }}/celeste-darwin-arm64.tar.gz
          tar xzf celeste-darwin-arm64.tar.gz
          sudo mv celeste-darwin-arm64 /usr/local/bin/celeste
          ```

          **Windows**:
          Download `celeste-windows-amd64.zip` and extract to a directory in your PATH.

          ### Verify Installation
          Check the signatures and checksums as described in [VERIFY.md](https://github.com/whykusanagi/celeste-cli/blob/main/VERIFY.md), then confirm the official persona:
          ```bash
          celeste persona verify
          ```

          ### Changes
          See [CHANGELOG.md](https://github.com/whykusanagi/celeste-cli/blob/main/CHANGELOG.md) for details.
        draft: false
        # Pre-release tags carry a hyphenated suffix (e.g. v1.10.0-rc.1, v1.10.0-dev.2);
        # publish those as GitHub pre-releases (not marked "latest"). Stable v1.10.0
        # tags publish as a normal release (action-gh-release@v1 marks non-prereleases
        # as "latest" automatically).
        prerelease: ${{ contains(github.ref_name, '-') }}
