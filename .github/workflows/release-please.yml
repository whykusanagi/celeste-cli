name: release-please

# Watches main, reads conventional commits, and keeps a standing "Release PR" that
# bumps the version + regenerates CHANGELOG.md. It never tags or creates a release
# (skip-github-release in release-please-config.json): after the Release PR merges,
# the owner pushes a GPG-signed tag on the merge commit (git tag -s vX.Y.Z), which
# triggers release.yml to build, sign and publish, and then relabels the merged PR
# from "autorelease: pending" to "autorelease: tagged" so the next Release PR can open.
# See RELEASE_CHECKLIST.md section 5.
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # IMPORTANT: use a PAT (secret RELEASE_PLEASE_TOKEN, contents+PR write) so
          # pushes to the Release PR branch TRIGGER ci.yml (the full OS matrix runs
          # on release-please--* branches). The default GITHUB_TOKEN cannot trigger
          # other workflows, so with the fallback the Release PR runs no CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
